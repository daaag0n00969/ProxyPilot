name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ProxyPilot.slnx

      - name: Test
        run: dotnet test ProxyPilot.slnx -c Release --no-restore --verbosity minimal

      - name: Publish
        run: dotnet publish ProxyPilot/ProxyPilot.csproj -c Release -r win-x64 --self-contained false -o artifacts
